        const canvas = document.getElementById('webgl-canvas');
        const tooltip = document.getElementById('sphere-tooltip');
        const modal = document.getElementById('bloggerModal');
        const modalClose = document.getElementById('modalClose');
        const modalImg = document.getElementById('modalImg');
        const modalRank = document.getElementById('modalRank');
        const modalName = document.getElementById('modalName');
        const modalHandle = document.getElementById('modalHandle');
        const modalFoll = document.getElementById('modalFoll');
        const modalTier = document.getElementById('modalTier');
        const modalBio = document.getElementById('modalBio');
        const modalDetailLink = document.getElementById('modalDetailLink');
        const modalIgLink = document.getElementById('modalIgLink');

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.0012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(0, 150, 480);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.maxDistance = 1200;
        controls.minDistance = 60;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x6366f1, 2.5, 1200);
        pointLight1.position.set(200, 300, 200);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xec4899, 2.0, 1200);
        pointLight2.position.set(-200, -200, -200);
        scene.add(pointLight2);

        const coreLight = new THREE.PointLight(0x38bdf8, 3.0, 600);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);

        const starsGeo = new THREE.BufferGeometry();
        const starCount = 3500;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 2200;
            starPositions[i + 1] = (Math.random() - 0.5) * 2200;
            starPositions[i + 2] = (Math.random() - 0.5) * 2200;

            const colorChoice = Math.random();
            if (colorChoice > 0.7) {
                starColors[i] = 0.6; starColors[i + 1] = 0.7; starColors[i + 2] = 1.0;
            } else if (colorChoice > 0.4) {
                starColors[i] = 1.0; starColors[i + 1] = 0.6; starColors[i + 2] = 0.9;
            } else {
                starColors[i] = 0.9; starColors[i + 1] = 0.9; starColors[i + 2] = 1.0;
            }
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starsMat = new THREE.PointsMaterial({
            size: 2.2,
            vertexColors: true,
            transparent: true,
            opacity: 0.8
        });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        const coreGeo = new THREE.SphereGeometry(14, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0x818cf8,
            wireframe: true,
            transparent: true,
            opacity: 0.35
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        const textureLoader = new THREE.TextureLoader();
        const bloggerMeshes = [];
        const bloggerGroup = new THREE.Group();
        scene.add(bloggerGroup);

        function getFollowerRadius(foll) {
            const minF = 100;
            const maxF = 350000;
            const norm = (Math.log10(Math.max(foll, minF)) - Math.log10(minF)) / (Math.log10(maxF) - Math.log10(minF));
            return 6 + norm * 22;
        }

        const targets = {
            galaxy: [],
            helix: [],
            ring: []
        };

        const total = bloggersData.length;

        bloggersData.forEach((b, i) => {
            const radius = getFollowerRadius(b.followers_num);
            const sphereGeo = new THREE.SphereGeometry(radius, 32, 32);

            const texture = textureLoader.load(b.avatar, undefined, undefined, () => {});

            const sphereMat = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.35,
                metalness: 0.15,
                emissive: 0x1e1b4b,
                emissiveIntensity: 0.2
            });

            const mesh = new THREE.Mesh(sphereGeo, sphereMat);
            mesh.userData = b;

            if (b.rank <= 3) {
                const ringColor = b.rank === 1 ? 0xf59e0b : (b.rank === 2 ? 0xe2e8f0 : 0xb45309);
                const ringGeo = new THREE.RingGeometry(radius + 1.5, radius + 3.5, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: ringColor,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.8
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                mesh.add(ringMesh);
            }

            bloggerGroup.add(mesh);
            bloggerMeshes.push(mesh);

            const phi = Math.acos(-1 + (2 * i) / total);
            const theta = Math.sqrt(total * Math.PI) * phi;
            const distGalaxy = 160 + (i % 3) * 45;
            targets.galaxy.push({
                x: distGalaxy * Math.cos(theta) * Math.sin(phi),
                y: distGalaxy * Math.sin(theta) * Math.sin(phi) * 0.8,
                z: distGalaxy * Math.cos(phi)
            });

            const helixAngle = i * 0.35;
            const helixDist = 170;
            const helixY = (i - total / 2) * 12;
            targets.helix.push({
                x: helixDist * Math.cos(helixAngle),
                y: helixY,
                z: helixDist * Math.sin(helixAngle)
            });

            const ringIdx = i % 5;
            const orbitRadius = 90 + ringIdx * 55;
            const ringAngle = (Math.floor(i / 5) / Math.ceil(total / 5)) * Math.PI * 2 + (ringIdx * 0.4);
            targets.ring.push({
                x: orbitRadius * Math.cos(ringAngle),
                y: (Math.sin(ringAngle * 2) * 20),
                z: orbitRadius * Math.sin(ringAngle)
            });

            mesh.position.set(targets.galaxy[i].x, targets.galaxy[i].y, targets.galaxy[i].z);
        });

        function transformTo(modeName) {
            const currentTargets = targets[modeName];
            bloggerMeshes.forEach((mesh, i) => {
                new TWEEN.Tween(mesh.position)
                    .to(currentTargets[i], 1600)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
            });
        }

        document.getElementById('modeGalaxy').addEventListener('click', (e) => {
            setActiveBtn(e.target);
            transformTo('galaxy');
        });
        document.getElementById('modeHelix').addEventListener('click', (e) => {
            setActiveBtn(e.target);
            transformTo('helix');
        });
        document.getElementById('modeRing').addEventListener('click', (e) => {
            setActiveBtn(e.target);
            transformTo('ring');
        });

        function setActiveBtn(btn) {
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredMesh = null;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bloggerMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (hoveredMesh !== hit) {
                    if (hoveredMesh) hoveredMesh.material.emissiveIntensity = 0.2;
                    hoveredMesh = hit;
                    hoveredMesh.material.emissiveIntensity = 0.8;
                }
                
                tooltip.style.opacity = '1';
                tooltip.style.left = `${event.clientX}px`;
                tooltip.style.top = `${event.clientY}px`;
                tooltip.textContent = `⭐ #${hit.userData.rank} ${hit.userData.name} (${hit.userData.followers_str})`;
                document.body.style.cursor = 'pointer';
            } else {
                if (hoveredMesh) {
                    hoveredMesh.material.emissiveIntensity = 0.2;
                    hoveredMesh = null;
                }
                tooltip.style.opacity = '0';
                document.body.style.cursor = 'default';
            }
        });

        window.addEventListener('click', (event) => {
            if (event.target.closest('.blogger-modal') || event.target.closest('.view-switcher') || event.target.closest('.top-bar')) {
                return;
            }

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bloggerMeshes);

            if (intersects.length > 0) {
                const selected = intersects[0].object;
                showBloggerModal(selected.userData);

                controls.autoRotate = false;
                new TWEEN.Tween(controls.target)
                    .to({ x: selected.position.x, y: selected.position.y, z: selected.position.z }, 1000)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            }
        });

        function showBloggerModal(b) {
            modalImg.src = b.avatar;
            modalRank.textContent = `#${b.rank}`;
            modalName.textContent = b.name;
            modalHandle.textContent = `@${b.username}`;
            modalFoll.textContent = b.followers_str;
            modalTier.textContent = b.tier.split('(')[0].trim();
            modalBio.textContent = b.bio || 'مروج و بلاگر فعال کتاب در اینستاگرام.';
            modalDetailLink.href = b.detail_url;
            modalIgLink.href = b.ig_url;

            modal.classList.remove('hidden');
        }

        modalClose.addEventListener('click', () => {
            modal.classList.add('hidden');
            controls.autoRotate = true;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();

            bloggerMeshes.forEach(m => {
                m.rotation.y += 0.008;
            });

            coreMesh.rotation.y += 0.004;
            coreMesh.rotation.x += 0.002;

            starField.rotation.y += 0.0002;

            renderer.render(scene, camera);
        }

        animate();
    </script>
