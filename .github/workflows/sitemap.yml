name: Auto Update Sitemap

on:
  push:
    branches: [ main ]
    paths:
      - 'blogger/**'
      - 'index.html'
      - 'top-posts.html'
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Sitemap and Robots
        run: |
          python -c "
          import os, glob
          from datetime import datetime

          SITE_URL = 'https://bookbloger.github.io'
          now_iso = datetime.now().strftime('%Y-%m-%d')

          urls = [
              {'loc': f'{SITE_URL}/', 'lastmod': now_iso, 'changefreq': 'daily', 'priority': '1.0'},
              {'loc': f'{SITE_URL}/top-posts.html', 'lastmod': now_iso, 'changefreq': 'daily', 'priority': '0.9'}
          ]

          blogger_files = sorted(glob.glob('blogger/*.html'))
          for bf in blogger_files:
              slug = os.path.basename(bf)
              urls.append({'loc': f'{SITE_URL}/blogger/{slug}', 'lastmod': now_iso, 'changefreq': 'weekly', 'priority': '0.8'})

          xml_lines = [
              '<?xml version=\"1.0\" encoding=\"UTF-8\"?>',
              '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"',
              '        xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"',
              '        xsi:schemaLocation=\"http://www.sitemaps.org/schemas/sitemap/0.9 http://www.sitemaps.org/schemas/sitemap/0.9/sitemap.xsd\">'
          ]
          for u in urls:
              xml_lines.append('  <url>')
              xml_lines.append(f'    <loc>{u[\"loc\"]}</loc>')
              xml_lines.append(f'    <lastmod>{u[\"lastmod\"]}</lastmod>')
              xml_lines.append(f'    <changefreq>{u[\"changefreq\"]}</changefreq>')
              xml_lines.append(f'    <priority>{u[\"priority\"]}</priority>')
              xml_lines.append('  </url>')
          xml_lines.append('</urlset>')

          with open('sitemap.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join(xml_lines))

          with open('robots.txt', 'w', encoding='utf-8') as f:
              f.write(f'User-agent: *\nAllow: /\n\nSitemap: {SITE_URL}/sitemap.xml\n')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml robots.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(seo): auto-update sitemap.xml and robots.txt" && git push)
